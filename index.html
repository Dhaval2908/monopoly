<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Desi Business Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-board">
        <div class="center-piece">
            <div class="logo">DESI BUSINESS</div>
            <div class="dice-area">
                <div class="scene"><div id="cube1" class="cube"></div></div>
                <div class="scene"><div id="cube2" class="cube"></div></div>
            </div>
            <button id="roll-btn">ROLL DICE</button>
            <p id="status-msg">PLAYER 1 (🛺) TURN</p>
        </div>
    </div>
    <div id="card-modal">
        <div class="detail-card" id="detail-card-content">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
